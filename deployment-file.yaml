# AWS CloudFormation Git sync stack deployment file.
# This file (not the template) is what Git sync actually watches in
# combination with the template it points to. Edit values here and commit -
# no console access required to change parameters/tags after initial setup.
template-file-path: template.yaml
parameters:
  ProjectTag: iam-automation-lab
  TemporaryPasswordLength: 16
tags:
  environment: lab
  owner: arnold
  managed-by: cloudformation-git-sync